<section class="max-w-xl mx-auto space-y-4">
  <h1 class="text-2xl font-semibold text-slate-800 mb-2">تنظیمات اعلان‌ها</h1>
  <p class="text-sm text-slate-600 mb-4">
    این صفحه هم تنظیمات اعلان را دارد، هم یک دکمه برای تست نوتیفیکیشن «نوشیدنی جدید اضافه شد».
  </p>

  <app-card>
    <ng-template #cardHeader>
      <div class="flex items-center justify-between w-full">
        <span class="font-semibold text-slate-800"> اعلان‌های نوشیدنی‌های جدید </span>
        <span class="text-xs text-slate-500"> Persian Drinks Hub </span>
      </div>
    </ng-template>

    <ng-template #cardBody>
      <div class="space-y-3 text-sm text-slate-700">
        <p>
          با فعال کردن اعلان‌ها، وقتی نوشیدنی جدیدی اضافه شود، می‌توانید یک نوتیفیکیشن روی دستگاه
          ببینید.
        </p>

        <button
          type="button"
          class="px-4 py-2 text-xs rounded-full bg-red-800 text-white shadow-sm hover:shadow-md hover:-translate-y-0.5 transition cursor-pointer"
          (click)="enableNotifications()"
        >
          فعال‌سازی اعلان‌ها
        </button>

        @if (status()) {
          <p class="text-xs text-green-700 mt-2">
            {{ status() }}
          </p>
        }
      </div>
    </ng-template>

    <ng-template #cardFooter>
      <button
        type="button"
        class="px-4 py-2 text-xs rounded-full bg-slate-800 text-white shadow-sm hover:shadow-md hover:-translate-y-0.5 transition cursor-pointer"
        (click)="testNewDrinkNotification()"
      >
        تست نوتیفیکیشن «نوشیدنی جدید اضافه شد»
      </button>
    </ng-template>

    <ng-template #cardFooter>
      <button
        type="button"
        class="px-4 py-2 text-xs mt-2 rounded-full bg-slate-500 text-white cursor-pointer"
        (click)="subscribeToPush()"
      >
        subscribe to Web Push (demo)
      </button>
    </ng-template>
  </app-card>
</section>
